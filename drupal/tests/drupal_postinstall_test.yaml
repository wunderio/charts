suite: drupal post-install hook
templates:
  - post-release.yaml
capabilities:
  apiVersions:
    - pxc.percona.com/v1
tests:
  - it: is a helm hook
    template: post-release.yaml
    asserts:
      - isKind:
          of: Job

  - it: uses the right docker image
    template: post-release.yaml
    set:
      php.image: 'drupal-12345'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 'drupal-12345'

  - it: runs the right post-install command
    template: post-release.yaml
    set:
      php.postinstall.command: foo
      php.postupgrade.command: bar
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'set -e'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'foo'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'bar'

  - it: exports reference data by default after each deployment
    template: post-release.yaml
    set:
      # Simulate a deployment on the reference environment
      environmentName: reference-environment
      referenceData.referenceEnvironment: reference-environment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Dump reference database'

  - it: doesn't exports reference data after deployments if disabled
    template: post-release.yaml
    set:
      # Simulate a deployment on the reference environment
      environmentName: reference-environment
      referenceData.referenceEnvironment: reference-environment
      referenceData.updateAfterDeployment: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Dump reference database'

  - it: sets environment variables correctly
    template: post-release.yaml
    set:
      php.env:
        foo: bar
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: foo
            value: bar

  - it: has public files mounted (without provisioner)
    template: post-release.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: "drupal-public-files"
            persistentVolumeClaim:
              claimName: RELEASE-NAME-public-files
              
  - it: has public files mounted (silta-shared storageclass, with provisioner)
    template: post-release.yaml
    capabilities:
      apiVersions:
        - silta.wdr.io/v1
    set:
      mounts.public-files.storageClassName: silta-shared
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: "drupal-public-files"
            persistentVolumeClaim:
              claimName: RELEASE-NAME-public-files2
              
  - it: has public files mounted (non-silta-shared storageclass, with provisioner)
    template: post-release.yaml
    capabilities:
      apiVersions:
        - silta.wdr.io/v1
    set:
      mounts.public-files.storageClassName: foo
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: "drupal-public-files"
            persistentVolumeClaim:
              claimName: RELEASE-NAME-public-files

  - it: can override default php resource requests and limits
    template: post-release.yaml
    set:
      php.postinstall.resources:
        requests:
          cpu: 124m
          memory: 2G
        limits:
          cpu: 235m
          memory: 4G
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 124m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2G
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 235m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4G

  # The post-release Job runs as an ArgoCD PostSync hook after every sync, and
  # ArgoCD renders with `helm template` where .Release.IsInstall is always true.
  # Whether to import reference data is decided at runtime from the database.
  - it: decides whether this is a new environment from the database's table count
    template: post-release.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "SELECT COUNT\\(\\*\\) FROM information_schema.TABLES WHERE TABLE_SCHEMA = '\\$\\{DB_NAME\\}'"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'NEW_ENVIRONMENT=true'
      # Fail closed: if the table count cannot be read, stop before importing.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)if ! DB_TABLE_COUNT=.*Could not count the tables[^\n]*\n\s*exit 1'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'drush status[^\n]*\n[^\n]*NEW_ENVIRONMENT'

  - it: checks the database before importing reference files or the database
    template: post-release.yaml
    set:
      environmentName: feature-x
      referenceData.referenceEnvironment: master
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)Waiting for database.*CREATE DATABASE IF NOT EXISTS.*information_schema.TABLES.*if \[ "\$NEW_ENVIRONMENT" == "true" \]; then\s+touch "\$INSTALLING_FILE".*Importing public-files files.*Dropping old database.*\n\s+fi\n'
      # Nothing imports before the check.
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)Importing public-files files.*information_schema.TABLES'

  - it: renders the same import gate on upgrade as on install
    template: post-release.yaml
    release:
      upgrade: true
    set:
      environmentName: feature-x
      referenceData.referenceEnvironment: master
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)if \[ "\$NEW_ENVIRONMENT" == "true" \]; then\s+touch "\$INSTALLING_FILE".*Dropping old database'

  - it: never imports reference data on the reference environment
    template: post-release.yaml
    set:
      environmentName: master
      referenceData.referenceEnvironment: master
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Dropping old database'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Importing public-files files'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'not importing its own reference data'
      # It still exports after deployment.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Dump reference database'

  - it: does not import reference data when it is disabled
    template: post-release.yaml
    set:
      environmentName: feature-x
      referenceData.enabled: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Dropping old database'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'Importing public-files files'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'information_schema.TABLES'

  - it: runs the post-install command only for a new environment
    template: post-release.yaml
    set:
      php.postinstall.command: run-postinstall
      php.postupgrade.command: run-postupgrade
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'if \[ "\$NEW_ENVIRONMENT" == "true" \]; then\s+run-postinstall\s+rm -f "\$INSTALLING_FILE" \|\| true\s+fi\s+run-postupgrade'
