apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets-simple
  labels:
    {{ include "simple.release_labels" . | indent 4 }}
type: Opaque
data:
  {{- if and .Values.nginx.basicauth.enabled (not .Values.nginx.basicauth.existingSecret) }}
  .htaccess: |
    {{ printf "%s:{PLAIN}%s" .Values.nginx.basicauth.credentials.username .Values.nginx.basicauth.credentials.password | b64enc }}
  {{- end }}

  {{- if and .Values.signalsciences.enabled (not .Values.signalsciences.existingSecret) }}
  signalsciences_accesskeyid: {{ .Values.signalsciences.accesskeyid | b64enc | quote }}
  signalsciences_secretaccesskey: {{ .Values.signalsciences.secretaccesskey | b64enc | quote }}
  {{- end }}
{{- /*
The chart always renders <release>-secrets-simple itself, so an existingSecret
of that name would be overwritten on every sync.
*/}}
{{- $reserved := printf "%s-secrets-simple" .Release.Name }}
{{- $existing := dict "signalsciences.existingSecret" .Values.signalsciences.existingSecret "nginx.basicauth.existingSecret" .Values.nginx.basicauth.existingSecret }}
{{- range $key, $secretName := $existing }}
{{- if eq $secretName $reserved }}
{{- fail (printf "%s must not be %s: the chart renders that Secret itself" $key $reserved) }}
{{- end }}
{{- end }}
