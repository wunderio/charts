{{- if or (ne .Values.php.preupgrade.command "") .Values.php.preupgrade.backup }}
{{- /*
  Under plain Helm this is a pre-upgrade hook, so it runs before the release's
  own resources are applied. When backups have just been enabled the backup PVC
  does not exist yet and the Pod would sit Pending, so hold the Job back until
  the claim is there.

  ArgoCD cannot use that guard: its repo-server has no cluster access, so lookup
  always returns empty and the Job would never render at all. There the
  Sync-phase wave ordering below guarantees the claim exists first instead.
*/}}
{{- $render := true }}
{{- if and (not .Values.argocd.enabled) .Values.php.preupgrade.backup }}
{{- $claimName := printf "%s-backup" .Release.Name }}
{{- if and ( eq $.Values.backup.storageClassName "silta-shared" ) ( eq ( include "silta-cluster.rclone.has-provisioner" $ ) "true" ) }}
{{- $claimName = printf "%s-backup2" .Release.Name }}
{{- end }}
{{- if not (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $claimName) }}
{{- $render = false }}
{{- end }}
{{- end }}
{{- if $render }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-pre-release"
  labels:
    {{- include "drupal.release_labels" . | nindent 4 }}
  annotations:
    # Keep Helm hook annotations for backwards compatibility with Helm releases.
    "helm.sh/hook": "pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    # ArgoCD: a Sync-phase hook rather than PreSync. The Job mounts the `mounts`
    # PVCs, the drupal ConfigMap and — with backups on — the backup PVC, all of
    # which the Sync phase creates. Wave 1 orders it after them (wave 0) and
    # before the deployments (wave 2).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "drupal.release_labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
      - name: pre-release
        image: {{ include "drupal.image" .Values.php.image | quote }}
        env:
        {{- include "drupal.pre-release-env" . | nindent 8 }}
        command: ["/bin/bash", "-c"]
        args:
        - |
            {{- include "drupal.pre-release-command" . | nindent 12 }}
        volumeMounts:
          {{- include "drupal.volumeMounts" . | nindent 10 }}
          {{- if .Values.php.preupgrade.backup }}
          - name: {{ .Release.Name }}-backup
            mountPath: /backups
          {{- end }}
        resources:
          {{- .Values.php.preupgrade.resources | toYaml | nindent 10 }}
      nodeSelector:
        {{- .Values.php.preupgrade.nodeSelector | toYaml | nindent 8 }}
      tolerations:
        {{- include "drupal.tolerations" .Values.php.preupgrade.nodeSelector | nindent 8 }}
      serviceAccountName: {{ include "drupal.serviceAccountName" . }}
      volumes:
        {{- include "drupal.volumes" . | nindent 8 }}
        {{- if .Values.php.preupgrade.backup }}
        - name: {{ .Release.Name }}-backup
          persistentVolumeClaim:
            {{- if and ( eq $.Values.backup.storageClassName "silta-shared" ) ( eq ( include "silta-cluster.rclone.has-provisioner" $ ) "true" ) }}
            claimName: {{ .Release.Name }}-backup2
            {{- else }}
            claimName: {{ .Release.Name }}-backup
            {{- end }}
        {{- end }}
{{- end }}
{{- end }}
