suite: drupal volumes
templates:
  - drupal-volumes.yaml
capabilities:
  apiVersions:
    - pxc.percona.com/v1
tests:
  - it: public files volume should be configurable
    template: drupal-volumes.yaml
    set:
      mounts:
        public-files:
          storage: 123Gi
          storageClassName: silta-shared
    asserts:
      - documentIndex: 1
        equal:
          path: spec.storageClassName
          value: silta-shared
      - documentIndex: 1
        equal:
          path: spec.resources.requests.storage
          value: 123Gi

  - it: mount without storageClassName omits the key so the cluster default applies
    template: drupal-volumes.yaml
    set:
      mounts:
        public-files:
          enabled: false
        private-files:
          enabled: false
        extra-files:
          enabled: true
          storage: 1Gi
          mountPath: /extra
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - notExists:
          path: spec.storageClassName

  - it: reference data pvc with an empty storageClassName omits the key
    template: drupal-volumes.yaml
    set:
      environmentName: master
      mounts:
        public-files:
          enabled: false
      referenceData:
        enabled: true
        referenceEnvironment: master
        storageClassName: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: master-reference-data
      - notExists:
          path: spec.storageClassName

  - it: reference data pvc with a non-shared storageClassName keeps it
    template: drupal-volumes.yaml
    set:
      environmentName: master
      mounts:
        public-files:
          enabled: false
      referenceData:
        enabled: true
        referenceEnvironment: master
        storageClassName: foo
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.storageClassName
          value: foo
