{{- if and .Values.github.prComment.enabled .Values.github.prComment.prNumber }}
---
# PostSync Job that posts the preview-environment URL as a GitHub PR comment.
#
# Shared by every Silta chart via the silta-release library chart. Rendered ONLY
# when github.prComment.prNumber is set — which the ArgoCD platform chart injects
# for PR environments (as silta-release.github.prComment). In the CircleCI/Flux
# (legacy Silta) flow these values are never set, so the Job is not rendered,
# keeping the chart backwards compatible. The ArgoCD hook annotations are inert
# outside ArgoCD.
#
# Best-effort: the script exits 0 even on GitHub API failure, so a comment
# problem never fails the sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-pr-comment"
  labels:
    release: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: pr-comment
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl jq >/dev/null 2>&1

              # --- GitHub token ---
              # Written into the namespace by the platform (Secret github-pr-token): an
              # installation token for this repository only, pull_requests: write, valid 1 hour.
              # The GitHub App key itself never reaches tenant namespaces.
              TOKEN="${GITHUB_TOKEN:-}"
              if [ -z "$TOKEN" ]; then
                echo "WARNING: no GitHub token in the namespace (Secret github-pr-token). Skipping PR comment."
                exit 0
              fi

              # --- Upsert the PR comment (find by marker, then PATCH or POST) ---
              REPO="{{ .Values.github.prComment.repository }}"
              PR_NUMBER="{{ .Values.github.prComment.prNumber }}"
              COMMENT_TAG="{{ .Values.github.prComment.commentTag }}-{{ .Release.Name }}"
              MARKER="<!-- ${COMMENT_TAG} -->"

              EXISTING_ID=$(curl -sf \
                -H "Authorization: token ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
                | jq -r ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
                | head -1) || true

              if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
                curl -sf -X PATCH \
                  -H "Authorization: token ${TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -d "$(jq -n --rawfile body /comment/comment-body.txt '{body: $body}')" \
                  "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments/${EXISTING_ID}" \
                  >/dev/null && echo "Updated existing PR comment." || echo "WARNING: Failed to update PR comment."
              else
                curl -sf -X POST \
                  -H "Authorization: token ${TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -d "$(jq -n --rawfile body /comment/comment-body.txt '{body: $body}')" \
                  "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
                  >/dev/null && echo "Posted new PR comment." || echo "WARNING: Failed to post PR comment."
              fi
              exit 0
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.prComment.secretName }}
                  key: token
                  # Missing token: the script skips the comment instead of failing the hook.
                  optional: true
          volumeMounts:
            - name: comment-body
              mountPath: /comment
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: comment-body
          configMap:
            name: {{ .Release.Name }}-pr-comment-body
---
# ConfigMap holding the Helm-rendered comment body. Kept separate from the Job
# args to avoid shell-escaping issues with the rendered Markdown.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pr-comment-body
  labels:
    release: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  comment-body.txt: |
    ### :rocket: Preview environment — `{{ .Release.Name }}`

    Your pull request is deployed to a preview environment:

    {{ if .Values.github.prComment.environmentUrl }}**{{ .Values.github.prComment.environmentUrl }}**{{ else }}_(environment URL not provided)_{{ end }}

    <!-- {{ .Values.github.prComment.commentTag }}-{{ .Release.Name }} -->
{{- end }}
