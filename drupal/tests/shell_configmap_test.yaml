suite: shell configmap
templates:
  - drupal-configmap.yaml
  - drupal-secret.yaml
  - shell-configmap.yaml
  - shell-secret.yaml
  - shell-deployment.yaml
capabilities:
  apiVersions:
    - pxc.percona.com/v1
tests:

  - it: Secret ConfigMap is created
    template: shell-configmap.yaml
    set:
      shell.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels.app
          value: drupal

  - it: Authorized keys addition is reflected into shell configmap
    template: shell-configmap.yaml
    set:
      shell.enabled: true
      shell.authorizedKeys:
        - foo
        - bar
    asserts:
      - template: shell-configmap.yaml
        equal:
          path: data.authorizedKeys
          value: |-
            foo
            bar

  - it: No extra authorized keys are present in template
    template: shell-configmap.yaml
    set:
      shell.enabled: true
      shell.authorizedKeys: []
    asserts:
      - template: shell-configmap.yaml
        equal:
          path: data.authorizedKeys
          value: ""

  - it: Adds keyserver environment variables when shell is enabled
    template: shell-deployment.yaml
    set:
      shell.enabled: true
      shell.gitAuth.keyserver.enabled: true
      shell.gitAuth.keyserver.url: foo.bar
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITAUTH_URL
            value: foo.bar
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITAUTH_USERNAME
            valueFrom:
              secretKeyRef:
                key: keyserver.username
                name: RELEASE-NAME-secrets-shell

  - it: Keyserver environment variables not present when shell is disabled
    template: shell-deployment.yaml
    set:
      shell.enabled: true
      shell.gitAuth.keyserver.enabled: false
      shell.gitAuth.keyserver.url: foo.bar
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITAUTH_URL
            value: foo.bar

  - it: Keyserver credentials come from existingSecret when it is set
    template: shell-deployment.yaml
    set:
      shell.enabled: true
      shell.gitAuth.keyserver.enabled: true
      shell.gitAuth.keyserver.existingSecret: keyserver-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITAUTH_USERNAME
            valueFrom:
              secretKeyRef:
                key: keyserver.username
                name: keyserver-credentials
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITAUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                key: keyserver.password
                name: keyserver-credentials

  - it: Shell secret is not rendered when existingSecret is set
    template: shell-secret.yaml
    set:
      shell.enabled: true
      shell.gitAuth.keyserver.existingSecret: keyserver-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: Shell secret carries the keyserver credentials by default
    template: shell-secret.yaml
    set:
      shell.enabled: true
      shell.gitAuth.keyserver.username: user
      shell.gitAuth.keyserver.password: pass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data["keyserver.username"]
          value: dXNlcg==
      - equal:
          path: data["keyserver.password"]
          value: cGFzcw==
