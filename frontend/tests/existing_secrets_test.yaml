suite: existing Secrets for Signal Sciences and basic auth
templates:
  - nginx.yaml
  - secret.yaml
  - NOTES.txt
  # Included by nginx.yaml for its checksum annotation.
  - configmap.yaml
tests:

  # --- Signal Sciences

  - it: Signal Sciences keys come from the chart's Secret by default
    template: nginx.yaml
    set:
      signalsciences.enabled: true
      signalsciences.accesskeyid: id
      signalsciences.secretaccesskey: key
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_ACCESSKEYID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets-frontend
                key: signalsciences_accesskeyid
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_SECRETACCESSKEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets-frontend
                key: signalsciences_secretaccesskey

  - it: Signal Sciences keys come from signalsciences.existingSecret when it is set
    template: nginx.yaml
    set:
      signalsciences.enabled: true
      signalsciences.existingSecret: sigsci-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_ACCESSKEYID
            valueFrom:
              secretKeyRef:
                name: sigsci-credentials
                key: signalsciences_accesskeyid
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_SECRETACCESSKEY
            valueFrom:
              secretKeyRef:
                name: sigsci-credentials
                key: signalsciences_secretaccesskey

  - it: chart Secret carries the Signal Sciences keys by default
    template: secret.yaml
    set:
      signalsciences.enabled: true
      signalsciences.accesskeyid: id
      signalsciences.secretaccesskey: key
    asserts:
      - equal:
          path: data.signalsciences_accesskeyid
          value: aWQ=
      - equal:
          path: data.signalsciences_secretaccesskey
          value: a2V5

  - it: chart Secret leaves out the Signal Sciences keys with signalsciences.existingSecret
    template: secret.yaml
    set:
      signalsciences.enabled: true
      signalsciences.existingSecret: sigsci-credentials
    asserts:
      - notExists:
          path: data.signalsciences_accesskeyid
      - notExists:
          path: data.signalsciences_secretaccesskey

  # --- Basic auth

  - it: Basic auth user file comes from the chart's Secret by default
    template: nginx.yaml
    set:
      nginx.basicauth.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-basicauth
            secret:
              secretName: RELEASE-NAME-secrets-frontend
              items:
                - key: .htaccess
                  path: .htaccess

  - it: Basic auth user file comes from nginx.basicauth.existingSecret when it is set
    template: nginx.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.existingSecret: basicauth-users
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-basicauth
            secret:
              secretName: basicauth-users
              items:
                - key: .htaccess
                  path: .htaccess

  - it: chart Secret carries the basic auth user file by default
    template: secret.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.credentials.username: user
      nginx.basicauth.credentials.password: pass
    asserts:
      - exists:
          path: data[".htaccess"]

  - it: chart Secret leaves out the basic auth user file with nginx.basicauth.existingSecret
    template: secret.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.existingSecret: basicauth-users
    asserts:
      - notExists:
          path: data[".htaccess"]

  - it: NOTES do not print basic auth credentials from an existing Secret
    template: NOTES.txt
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.credentials.password: do-not-print
      nginx.basicauth.existingSecret: basicauth-users
    asserts:
      - matchRegexRaw:
          pattern: "Basicauth credentials: stored in the Secret basicauth-users"
      - notMatchRegexRaw:
          pattern: do-not-print

  - it: NOTES print basic auth credentials from values by default
    template: NOTES.txt
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.credentials.username: shown-user
      nginx.basicauth.credentials.password: shown-password
    asserts:
      - matchRegexRaw:
          pattern: "Basicauth username: shown-user\n *Basicauth password: shown-password\n"

  # --- Reserved name

  # The chart always renders <release>-secrets-frontend, so it would overwrite an
  # external Secret of that name.
  - it: signalsciences.existingSecret may not be the chart's own Secret
    template: secret.yaml
    set:
      signalsciences.enabled: true
      signalsciences.existingSecret: RELEASE-NAME-secrets-frontend
    asserts:
      - failedTemplate:
          errorMessage: "signalsciences.existingSecret must not be RELEASE-NAME-secrets-frontend: the chart renders that Secret itself"

  - it: nginx.basicauth.existingSecret may not be the chart's own Secret
    template: secret.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.existingSecret: RELEASE-NAME-secrets-frontend
    asserts:
      - failedTemplate:
          errorMessage: "nginx.basicauth.existingSecret must not be RELEASE-NAME-secrets-frontend: the chart renders that Secret itself"
