suite: Backup Cron Jobs
templates:
  - _helpers.tpl
  - backup-cron.yaml
tests:
  - it: can set timezone
    template: backup-cron.yaml
    set:
      timezone: 'Foo/Bar'
      services.foo:
        image: 'bar'
        backup:
          command: echo "Hello world"
      backup:
        enabled: true
    capabilities:
      majorVersion: 1
      minorVersion: 25
    asserts:
      - equal:
          path: spec.timeZone
          value: 'Foo/Bar'
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TZ
            value: Foo/Bar
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: TZ
            value: Foo/Bar

  - it: renders service env values from Secrets in the backup container
    template: backup-cron.yaml
    set:
      services.foo:
        image: 'bar'
        backup:
          command: echo "Hello world"
        env:
          plain: baz
          FROM_SECRET:
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: my-key
      backup:
        enabled: true
    capabilities:
      majorVersion: 1
      minorVersion: 25
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: plain
            value: baz
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: FROM_SECRET
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: my-key

  - it: tolerates rsync exit code 24 when copying mounts
    template: backup-cron.yaml
    set:
      mounts.files:
        enabled: true
        storage: 1G
        mountPath: /app/files
        storageClassName: silta-shared
      services.foo:
        image: 'bar'
        mounts:
          - files
      backup:
        enabled: true
    capabilities:
      majorVersion: 1
      minorVersion: 25
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'rsync -az /values_mounts/ /backups/current/ \|\| rsync_status=\$\?'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '"\$rsync_status" -eq 24'
