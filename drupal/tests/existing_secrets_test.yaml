suite: existing Secrets for SMTP, Signal Sciences and basic auth
templates:
  - drupal-deployment.yaml
  - drupal-secret.yaml
  - smtp-secret.yaml
  - github-pr-comment.yaml
  # Included by drupal-deployment.yaml for its checksum annotations.
  - drupal-configmap.yaml
capabilities:
  apiVersions:
    - pxc.percona.com/v1
tests:

  # --- SMTP

  - it: SMTP password comes from the chart's own Secret by default
    template: drupal-deployment.yaml
    set:
      mailpit.enabled: false
      smtp.enabled: true
      smtp.address: smtp.example.com:587
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets-smtp
                key: password

  - it: SMTP password comes from smtp.existingSecret when it is set
    template: drupal-deployment.yaml
    set:
      mailpit.enabled: false
      smtp.enabled: true
      smtp.address: smtp.example.com:587
      smtp.username: smtp-user
      smtp.existingSecret: smtp-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSMTP_AUTHPASS
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: password

  - it: SMTP Secret is not rendered when smtp.existingSecret is set
    template: smtp-secret.yaml
    set:
      mailpit.enabled: false
      smtp.enabled: true
      smtp.existingSecret: smtp-credentials
    asserts:
      - hasDocuments:
          count: 0

  # The chart's own name is a likely choice when moving the password out of values.
  - it: SMTP Secret is not rendered when smtp.existingSecret uses the chart's own name
    template: smtp-secret.yaml
    set:
      mailpit.enabled: false
      smtp.enabled: true
      smtp.existingSecret: RELEASE-NAME-secrets-smtp
    asserts:
      - hasDocuments:
          count: 0

  - it: SMTP Secret carries the password by default
    template: smtp-secret.yaml
    set:
      mailpit.enabled: false
      smtp.enabled: true
      smtp.password: pass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.password
          value: cGFzcw==

  # mailpit takes over the SMTP address, so a production-only existingSecret must
  # not be required in an environment that runs mailpit.
  - it: smtp.existingSecret is ignored while mailpit is enabled
    template: drupal-deployment.yaml
    set:
      mailpit.enabled: true
      smtp.existingSecret: smtp-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets-smtp
                key: password

  - it: SMTP Secret is still rendered for mailpit when smtp.existingSecret is set
    template: smtp-secret.yaml
    set:
      mailpit.enabled: true
      smtp.existingSecret: smtp-credentials
    asserts:
      - hasDocuments:
          count: 1

  # --- Signal Sciences

  - it: Signal Sciences keys come from the chart's Secret by default
    template: drupal-deployment.yaml
    set:
      signalsciences.enabled: true
      signalsciences.accesskeyid: id
      signalsciences.secretaccesskey: key
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_ACCESSKEYID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets-drupal
                key: signalsciences_accesskeyid

  - it: Signal Sciences keys come from signalsciences.existingSecret when it is set
    template: drupal-deployment.yaml
    set:
      signalsciences.enabled: true
      signalsciences.existingSecret: sigsci-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_ACCESSKEYID
            valueFrom:
              secretKeyRef:
                name: sigsci-credentials
                key: signalsciences_accesskeyid
      - contains:
          path: spec.template.spec.containers[?(@.name == "sigsci")].env
          content:
            name: SIGSCI_SECRETACCESSKEY
            valueFrom:
              secretKeyRef:
                name: sigsci-credentials
                key: signalsciences_secretaccesskey

  - it: Drupal Secret carries the Signal Sciences keys by default
    template: drupal-secret.yaml
    set:
      signalsciences.enabled: true
      signalsciences.accesskeyid: id
      signalsciences.secretaccesskey: key
    asserts:
      - equal:
          path: data.signalsciences_accesskeyid
          value: aWQ=
      - equal:
          path: data.signalsciences_secretaccesskey
          value: a2V5

  - it: Drupal Secret leaves out the Signal Sciences keys with signalsciences.existingSecret
    template: drupal-secret.yaml
    set:
      signalsciences.enabled: true
      signalsciences.existingSecret: sigsci-credentials
    asserts:
      - notExists:
          path: data.signalsciences_accesskeyid
      - notExists:
          path: data.signalsciences_secretaccesskey

  # --- Basic auth

  - it: Basic auth user file comes from the chart's Secret by default
    template: drupal-deployment.yaml
    set:
      nginx.basicauth.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-basicauth
            secret:
              secretName: RELEASE-NAME-secrets-drupal
              items:
                - key: .htaccess
                  path: .htaccess

  - it: Basic auth user file comes from nginx.basicauth.existingSecret when it is set
    template: drupal-deployment.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.existingSecret: basicauth-users
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-basicauth
            secret:
              secretName: basicauth-users
              items:
                - key: .htaccess
                  path: .htaccess

  - it: Drupal Secret carries the basic auth user file by default
    template: drupal-secret.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.credentials.username: user
      nginx.basicauth.credentials.password: pass
    asserts:
      - exists:
          path: data[".htaccess"]

  - it: Drupal Secret leaves out the basic auth user file with nginx.basicauth.existingSecret
    template: drupal-secret.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.existingSecret: basicauth-users
    asserts:
      - notExists:
          path: data[".htaccess"]

  - it: PR comment does not print basic auth credentials from an existing Secret
    template: github-pr-comment.yaml
    documentIndex: 1
    set:
      silta-release.github.prComment.prNumber: "5"
      silta-release.github.prComment.repository: wunderio/drupal-project
      nginx.basicauth.enabled: true
      nginx.basicauth.credentials.password: do-not-print
      nginx.basicauth.existingSecret: basicauth-users
    asserts:
      - matchRegex:
          path: data["comment-body.txt"]
          pattern: "Credentials are in the Secret `basicauth-users`"
      - notMatchRegex:
          path: data["comment-body.txt"]
          pattern: do-not-print

  - it: PR comment prints basic auth credentials from values by default
    template: github-pr-comment.yaml
    documentIndex: 1
    set:
      silta-release.github.prComment.prNumber: "5"
      silta-release.github.prComment.repository: wunderio/drupal-project
      nginx.basicauth.enabled: true
      nginx.basicauth.credentials.password: shown-password
    asserts:
      - matchRegex:
          path: data["comment-body.txt"]
          pattern: "\\| Password \\| `shown-password` \\|"

  # --- Reserved name

  # The chart always renders <release>-secrets-drupal (hashsalt), so it would
  # overwrite an external Secret of that name.
  - it: smtp.existingSecret may not be the chart's Drupal Secret
    template: drupal-secret.yaml
    set:
      smtp.existingSecret: RELEASE-NAME-secrets-drupal
    asserts:
      - failedTemplate:
          errorMessage: "smtp.existingSecret must not be RELEASE-NAME-secrets-drupal: the chart renders that Secret itself"

  - it: signalsciences.existingSecret may not be the chart's Drupal Secret
    template: drupal-secret.yaml
    set:
      signalsciences.enabled: true
      signalsciences.existingSecret: RELEASE-NAME-secrets-drupal
    asserts:
      - failedTemplate:
          errorMessage: "signalsciences.existingSecret must not be RELEASE-NAME-secrets-drupal: the chart renders that Secret itself"

  - it: nginx.basicauth.existingSecret may not be the chart's Drupal Secret
    template: drupal-secret.yaml
    set:
      nginx.basicauth.enabled: true
      nginx.basicauth.existingSecret: RELEASE-NAME-secrets-drupal
    asserts:
      - failedTemplate:
          errorMessage: "nginx.basicauth.existingSecret must not be RELEASE-NAME-secrets-drupal: the chart renders that Secret itself"
