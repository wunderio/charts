suite: reference data
templates:
  - backup-cron.yaml
  - backup-volume.yaml
capabilities:
  apiVersions:
    - pxc.percona.com/v1
tests:
  - it: By default no backup cron job or volume is created
    template: backup-cron.yaml
    asserts:
    - hasDocuments:
        count: 0
    - hasDocuments:
        count: 0
      template: backup-volume.yaml

  - it: creates a backup cron job and volume
    template: backup-cron.yaml
    set:
      backup:
        enabled: true
    asserts:
    - hasDocuments:
        count: 1
    - isKind:
        of: CronJob
    - hasDocuments:
        count: 2
      template: backup-volume.yaml

  - it: backup pvc with an empty storageClassName omits the key
    template: backup-volume.yaml
    set:
      backup:
        enabled: true
        storageClassName: ""
    asserts:
    - hasDocuments:
        count: 1
    - isKind:
        of: PersistentVolumeClaim
    - equal:
        path: metadata.name
        value: RELEASE-NAME-backup
    - notExists:
        path: spec.storageClassName

  - it: backup pvc with a non-shared storageClassName keeps it
    template: backup-volume.yaml
    set:
      backup:
        enabled: true
        storageClassName: foo
    asserts:
    - hasDocuments:
        count: 1
    - equal:
        path: spec.storageClassName
        value: foo
