---
# Build charts from source and publish them to Harbor (oci://registry.wdr.io/charts).
#
# CircleCI still builds the charts for the GCS Helm repository
# (https://storage.googleapis.com/charts.wdr.io); this workflow is the Harbor
# path and does not touch GCS. A chart is published when its Chart.yaml version
# is not in Harbor yet, and a published version is never replaced.
#
# Only releases publish:
# - Merging a release/* pull request into master publishes every chart version
#   on master that Harbor lacks. A version bump merged in any other pull request
#   waits on master for the next release.
# - A manual run on master publishes the charts named in its `charts` input: for
#   charts that are released on their own (silta-cluster, csi-rclone, vmproxy, ...)
#   and for hotfixes. A failed run is retried by re-running its failed jobs.
name: Publish Helm charts to OCI registry

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      charts:
        description: >-
          Chart directories to publish, space-separated (e.g. "silta-cluster csi-rclone"),
          or "all" for every version on the branch that Harbor lacks
        type: string
        required: true
      dry_run:
        description: Build, lint and package, but do not push
        type: boolean
        default: false

permissions:
  contents: read

# One group for all refs: two runs that both see a version as missing would both push it.
concurrency:
  group: publish-oci
  cancel-in-progress: false

env:
  # Fixed, not an input: the robot credentials below are sent to this registry.
  OCI_REPO: oci://registry.wdr.io/charts
  DRY_RUN: ${{ inputs.dry_run || false }}
  # Harbor robot$ci (push on all projects); also used to read tags of a private project.
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  # The merge commit of a release pull request; the branch tip for a manual run.
  CHECKOUT_REF: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  detect:
    name: Find unpublished chart versions
    # A merged release/* pull request from this repository, or a manual run. Only master
    # publishes; other branches may run a dry run. A version pushed from an unmerged branch
    # would block master's version of it, as published versions are never replaced.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.merged
        && startsWith(github.event.pull_request.head.ref, 'release/')
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch'
        && (github.ref == 'refs/heads/master' || inputs.dry_run))
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Compare Chart.yaml versions with Harbor
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          CHARTS: ${{ inputs.charts }}
        run: |
          missing="$(.github/scripts/publish-oci.sh detect)"
          # A manual run publishes only the charts it names; detect lists them as ./<dir>.
          if [ "${EVENT}" = workflow_dispatch ] && [ "${CHARTS}" != all ]; then
            wanted=()
            for chart in ${CHARTS}; do
              chart="./${chart#./}"
              chart="${chart%/}"
              if [ ! -f "${chart}/Chart.yaml" ]; then
                echo "::error::No chart at ${chart}/Chart.yaml"
                exit 1
              fi
              wanted+=("${chart}")
            done
            if [ "${#wanted[@]}" -eq 0 ]; then
              echo "::error::Name the charts to publish, or \"all\""
              exit 1
            fi
            missing="$(jq -c --args '[.[] | select(IN($ARGS.positional[]))]' "${wanted[@]}" <<<"${missing}")"
          fi
          echo "Publishing: ${missing}"
          echo "charts=${missing}" >> "$GITHUB_OUTPUT"

  publish:
    name: Package & Push — ${{ matrix.chart }}
    needs: detect
    if: needs.detect.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # Also runs on a dry run, so a dry run proves the credentials work.
      - name: Log in to Harbor
        run: |
          registry="${OCI_REPO#oci://}"
          helm registry login "${registry%%/*}" --username "${REGISTRY_USERNAME}" \
            --password-stdin <<<"${REGISTRY_PASSWORD}"

      - name: Build, package and push
        env:
          CHART: ${{ matrix.chart }}
        run: .github/scripts/publish-oci.sh publish "${CHART}"
