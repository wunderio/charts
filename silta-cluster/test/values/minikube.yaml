traefik:
  replicas: 1
  ssl:
    enabled: true
  service:
    annotations:
      metallb.universe.tf/allow-shared-ip: "shared"
  # metallb shared ip works only with "Cluster" TP
  externalTrafficPolicy: Cluster

ssl:
  enabled: true
  email: admin@example.com
  issuer: selfsigned
  
csi-rclone:
  enabled: true
  # v3.1.2 moves fusermount3 out of /usr/bin, so the Ubuntu 26.04 runner's AppArmor
  # "fusermount3" profile no longer denies mounts under /var/lib/kubelet/pods (wunderio/csi-rclone#69).
  # CI pulls the published csi-rclone chart, so drop this once silta-cluster depends on
  # csi-rclone chart 1.2.x (default v3.1.2) and its Chart.lock is regenerated.
  version: v3.1.2
  params:
    remote: "s3"
    remotePath: "projectname"
    
    # Minio as S3 provider
    s3-provider: "Minio"
    s3-endpoint: "http://silta-cluster-minio:9000"
    # Default credentials of minio chart https://github.com/minio/charts/blob/master/minio/values.yaml
    s3-access-key-id: "YOURACCESSKEY"
    s3-secret-access-key: "YOURSECRETKEY"
  # nodePlugin:
  #   kubeletBasePath: "/var/snap/microk8s/common/var/lib/kubelet"

minio:
  enabled: true
  resources:
    requests:
      memory: 512M
  persistence:
    size: 5Gi

gitAuth:
  enabled: true
  port: 2222
  keyserver:
    enabled: false
  authorizedKeys: []
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared"
  # metallb shared ip works only with "Cluster" TP 
  externalTrafficPolicy: Cluster
  
sshKeyServer:
  enabled: false

# Deployment remover
deploymentRemover:
  enabled: false

docker-registry:
  enabled: true
  secrets:
    htpasswd: false
