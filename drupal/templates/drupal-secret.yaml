apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets-drupal
  labels:
    {{- include "drupal.release_labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.php.hashsalt }}
  hashsalt: "{{ .Values.php.hashsalt | b64enc }}"
  {{ else }}
  hashsalt: {{ "{{ randAlphaNum 10 }}" | b64enc }}
  {{- end }}

  {{- if and .Values.nginx.basicauth.enabled (not .Values.nginx.basicauth.existingSecret) }}
  .htaccess: | 
    {{ printf "%s:{PLAIN}%s" .Values.nginx.basicauth.credentials.username .Values.nginx.basicauth.credentials.password | b64enc }}
  {{- end }}

  {{- if and .Values.signalsciences.enabled (not .Values.signalsciences.existingSecret) }}
  signalsciences_accesskeyid: {{ .Values.signalsciences.accesskeyid | b64enc | quote }}
  signalsciences_secretaccesskey: {{ .Values.signalsciences.secretaccesskey | b64enc | quote }}
  {{- end }}
{{- /*
The chart always renders <release>-secrets-drupal itself (hashsalt), so an
existingSecret of that name would be overwritten on every sync.
*/}}
{{- $reserved := printf "%s-secrets-drupal" .Release.Name }}
{{- $existing := dict "smtp.existingSecret" .Values.smtp.existingSecret "signalsciences.existingSecret" .Values.signalsciences.existingSecret "nginx.basicauth.existingSecret" .Values.nginx.basicauth.existingSecret }}
{{- range $key, $name := $existing }}
{{- if eq $name $reserved }}
{{- fail (printf "%s must not be %s: the chart renders that Secret itself" $key $reserved) }}
{{- end }}
{{- end }}
