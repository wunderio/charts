{{- range $kind := list "insert" "select" }}
{{- $ingress := index $.Values.ingress $kind | default dict }}
{{- if $ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- /* The insert Ingress keeps the release name it had before the split. */}}
  name: {{ $.Release.Name }}{{ if eq $kind "select" }}-select{{ end }}
  annotations:
    {{- range $key, $value := $ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  rules:
  - host: {{ $ingress.host }}
    http:
      paths:
      {{- range $signal := list "metrics" "logs" "traces" }}
      - backend:
          service:
            name: {{ $.Release.Name }}
            port:
              number: {{ $.Values.service.port }}
        path: /{{ $signal }}/{{ $kind }}
        pathType: Prefix
      {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
