suite: HorizontalPodAutoscaler
templates:
  - drupal-configmap.yaml
  - drupal-deployment.yaml
  - drupal-secret.yaml
tests:
  - it: HPA resource is present when autoscaler is enabled
    template: drupal-deployment.yaml
    set:
      autoscaling:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
  - it: HPA resource is absent when autoscaler is disabled
    template: drupal-deployment.yaml
    set:
      autoscaling:
        enabled: false
    asserts:
      - hasDocuments:
          count: 1
  - it: HPA defines pre 1.23 format metrics
    template: drupal-deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 22
      apiVersions:
        - autoscaling/v2beta1
    set:
      autoscaling:
        enabled: true
        metrics:
        - type: Resource
          resource:
            name: foo
            targetAverageUtilization: bar
    asserts:
      - documentIndex: 1
        contains:
          path: spec.metrics
          content:
            resource:
              name: foo
              targetAverageUtilization: bar
            type: Resource
  - it: HPA defines 1.23+ format metrics
    template: drupal-deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 23
      apiVersions:
        - autoscaling/v2
    set:
      autoscaling:
        enabled: true
        metrics:
        - type: Resource
          resource:
            name: foo
            targetAverageUtilization: bar
    asserts:
      - documentIndex: 1
        contains:
          path: spec.metrics
          content:
            resource:
              name: foo
              target:
                type: Utilization
                averageUtilization: bar
            type: Resource
  - it: HPA scales on CPU only by default
    template: drupal-deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 23
      apiVersions:
        - autoscaling/v2
    set:
      autoscaling:
        enabled: true
    asserts:
      - documentIndex: 1
        lengthEqual:
          path: spec.metrics
          count: 1
      - documentIndex: 1
        equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - documentIndex: 1
        notExists:
          path: spec.behavior
  - it: HPA keeps a project's own metrics list, memory included
    template: drupal-deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 23
      apiVersions:
        - autoscaling/v2
    set:
      autoscaling:
        enabled: true
        metrics:
        - type: Resource
          resource:
            name: cpu
            targetAverageUtilization: 80
        - type: Resource
          resource:
            name: memory
            targetAverageUtilization: 80
    asserts:
      - documentIndex: 1
        lengthEqual:
          path: spec.metrics
          count: 2
      - documentIndex: 1
        equal:
          path: spec.metrics[1].resource.name
          value: memory
  - it: HPA renders behavior when set
    template: drupal-deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 23
      apiVersions:
        - autoscaling/v2
    set:
      autoscaling:
        enabled: true
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300
    asserts:
      - documentIndex: 1
        equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
  - it: HPA omits behavior on autoscaling/v2beta1
    template: drupal-deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 22
      apiVersions:
        - autoscaling/v2beta1
    set:
      autoscaling:
        enabled: true
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300
    asserts:
      - documentIndex: 1
        notExists:
          path: spec.behavior
